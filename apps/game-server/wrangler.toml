name = "chowka-bhara"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Comma-separated. Supports exact origins and https://*.vercel.app wildcards.
ALLOWED_ORIGINS = "http://localhost:4321,http://127.0.0.1:4321,https://*.vercel.app"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]
